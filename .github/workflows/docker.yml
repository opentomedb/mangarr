# Builds, tests and publishes the Mangarr image (ghcr.io/opentomedb/mangarr).
#
# Build number: 10.0.0.(.build-base + commits since the last export), see the version job.
#
#   tag v*            -> core tests, image for amd64 + arm64, a start-up smoke test of each, then
#                        push :<tag without v> and :beta, and create the GitHub Release (notes from
#                        CHANGELOG.md plus a "Build: 10.0.0.N" line the in-app release check reads).
#   workflow_dispatch -> the same checks. It pushes only when run on a v* tag; on a branch it's a
#                        dry run.
#
# The arm64 image is built under QEMU and smoke-tested on a native arm64 runner. If either fails,
# the release is pushed amd64-only, with a warning on the run.
name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/opentomedb/mangarr

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Build number and image tag
        run: |
          # The public repository gets one commit per export. scripts/export-public.sh writes the private
          # history's commit count into .build-base at each export, so the build number is that base plus
          # the commits made since the export last rewrote .build-base (0 for the exported commit itself):
          # the public build then equals the private build it was exported from, release after release.
          # Without the file (the private repository) it is the plain commit count.
          if [ -f .build-base ]; then
            base="$(tr -d '[:space:]' < .build-base)"
            if [[ ! "$base" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::.build-base must hold a positive integer, found '$base'"
              exit 1
            fi
            since="$(git rev-list --count "$(git log -1 --format=%H -- .build-base)"..HEAD)"
            build="10.0.0.$(( base + since ))"
          else
            build="10.0.0.$(git rev-list --count HEAD)"
          fi
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            # A Docker tag, and nothing that reaches a shell unquoted: 0.1.0-beta.1 and the like.
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag v$tag is not v<major>.<minor>.<patch>[-<pre>]"
              exit 1
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Build **$build**, image tag **${tag:-none (not a v* tag: nothing is pushed)}**" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The same SDK image and steps the maintainer's test runs use (CONTRIBUTING.md).
    container: mcr.microsoft.com/dotnet/sdk:6.0
    # MSBuild reads these as properties. SourceLink's git reader (Microsoft.Build.Tasks.Git 1.1.1) fails on
    # the checkout's repositoryformatversion 1 ("Only versions up to 0 are supported"); the image build
    # never sees .git (.dockerignore), so only this job needs them.
    env:
      EnableSourceControlManagerQueries: 'false'
      EnableSourceLink: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The database tests load the system libsqlite3.so.0, which the SDK image lacks. Pinned to the
      # Debian 11 main-archive build; the security-archive build the image prefers has 404ed.
      - name: Install libsqlite3
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-0=3.34.1-3

      - name: Build
        run: |
          for project in src/NzbDrone.Mono/Readarr.Mono.csproj src/Readarr.Api.V1/Readarr.Api.V1.csproj src/NzbDrone.Core.Test/Readarr.Core.Test.csproj; do
            dotnet build "$project" -c Release -p:Platform=Posix -p:SolutionDir="$GITHUB_WORKSPACE/src/" -p:RunAnalyzers=false -nologo -v q
          done
          cp _output/net6.0/Readarr.Mono.dll _tests/net6.0/

      # Readarr's network-dependent Goodreads/BookInfo fixtures are [Ignore]d in the source, so they
      # are skipped here without a filter of their own.
      - name: Test
        run: >
          dotnet test src/NzbDrone.Core.Test/Readarr.Core.Test.csproj -c Release -p:Platform=Posix
          -p:SolutionDir="$GITHUB_WORKSPACE/src/" -p:RunAnalyzers=false --no-build
          --filter "Category!=ManualTest&Category!=IntegrationTest&Category!=AutomationTest&Category!=WINDOWS"
          --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults

  image:
    name: Build image
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      arm64: ${{ steps.arm64.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Each platform is exported for its smoke job and cached, so the push job rebuilds the same
      # layers from cache instead of compiling again.
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: MANGARR_VERSION=${{ needs.version.outputs.build }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: mangarr:smoke
          outputs: type=docker,dest=${{ runner.temp }}/mangarr-amd64.tar
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Build linux/arm64 (QEMU)
        id: arm64
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: MANGARR_VERSION=${{ needs.version.outputs.build }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: mangarr:smoke
          outputs: type=docker,dest=${{ runner.temp }}/mangarr-arm64.tar
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Upload amd64 image
        uses: actions/upload-artifact@v4
        with:
          name: image-amd64
          path: ${{ runner.temp }}/mangarr-amd64.tar
          retention-days: 1

      - name: Upload arm64 image
        if: steps.arm64.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: image-arm64
          path: ${{ runner.temp }}/mangarr-arm64.tar
          retention-days: 1

  smoke-amd64:
    name: Smoke test (amd64)
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: ${{ runner.temp }}

      - name: Start the image and ask /api/v1/system/status
        env:
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          docker load -i "$RUNNER_TEMP/mangarr-amd64.tar"
          bash scripts/ci/smoke-test.sh mangarr:smoke "$BUILD"

  smoke-arm64:
    name: Smoke test (arm64)
    needs: [version, image]
    if: needs.image.outputs.arm64 == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: ${{ runner.temp }}

      - name: Start the image and ask /api/v1/system/status
        env:
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          docker load -i "$RUNNER_TEMP/mangarr-arm64.tar"
          bash scripts/ci/smoke-test.sh mangarr:smoke "$BUILD"

  push:
    name: Push to GHCR
    needs: [version, image, smoke-amd64, smoke-arm64]
    # always(): run even when the arm64 smoke job was skipped or failed; amd64 alone must pass.
    if: always() && needs.version.outputs.tag != '' && needs.image.result == 'success' && needs.smoke-amd64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # contents: write only for the GitHub Release at the end; every other job keeps the read-only default.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: platforms
        name: Choose platforms
        run: |
          if [ "${{ needs.smoke-arm64.result }}" = "success" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "Platforms: **amd64 + arm64**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "::warning title=amd64 only::The arm64 image did not build or failed its smoke test (build: ${{ needs.image.outputs.arm64 }}, smoke: ${{ needs.smoke-arm64.result }}). Pushing amd64 only; say so in the release notes."
            echo "Platforms: **amd64 only** (arm64 build: ${{ needs.image.outputs.arm64 }}, smoke: ${{ needs.smoke-arm64.result }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build from cache and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          build-args: MANGARR_VERSION=${{ needs.version.outputs.build }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.IMAGE }}:beta
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          push: true

      - name: Summary
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          echo "Pushed \`${IMAGE}:${TAG}\` and \`${IMAGE}:beta\` (build ${BUILD})." >> "$GITHUB_STEP_SUMMARY"

      # Title "Mangarr <tag>", notes = CHANGELOG.md's "## <tag>" section, then the build number on its
      # own line. NewReleaseCheck (Mangarr's in-app notice) parses that "Build: 10.0.0.N" line and
      # ignores a release without it, so keep its shape. A beta tag is marked prerelease. A re-run edits
      # the release instead of failing on it.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          BUILD: ${{ needs.version.outputs.build }}
          ARM64: ${{ needs.smoke-arm64.result }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $TAG" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::warning title=No changelog section::CHANGELOG.md has no '## $TAG' section; the release notes carry only the build number."
            : > "$notes"
          fi
          if [ "$ARM64" != "success" ]; then
            printf '\n**amd64 only:** the arm64 image did not pass its checks for this release.\n' >> "$notes"
          fi
          printf '\nBuild: %s\n' "$BUILD" >> "$notes"
          prerelease=()
          if [[ "$TAG" == *beta* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "v$TAG" > /dev/null 2>&1; then
            gh release edit "v$TAG" --title "Mangarr $TAG" --notes-file "$notes" "${prerelease[@]}"
          else
            gh release create "v$TAG" --verify-tag --title "Mangarr $TAG" --notes-file "$notes" "${prerelease[@]}"
          fi
          echo "Release **Mangarr $TAG** (build $BUILD)." >> "$GITHUB_STEP_SUMMARY"
